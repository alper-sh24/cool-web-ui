<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Gallery</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
    <style>
        :root {
            --ds-bg-base: #e6e5e0;
            --ds-border: #000000;
            --ds-text: #000000;
            --ds-accent-green: #7cb342;
            --ds-accent-cyan: #4dd0e1;
            --ds-accent-yellow: #ffee58;
            --ds-accent-white: #ffffff;
            --ds-font-primary: "Helvetica Neue", Helvetica, Arial, sans-serif;
            --ds-font-mono: "Courier New", Courier, monospace;

            /* Virtual viewport every preview is rendered at before being scaled down */
            --preview-w: 1440px;
            --preview-h: 900px;
        }

        [x-cloak] { display: none !important; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--ds-bg-base);
            color: var(--ds-text);
            font-family: var(--ds-font-primary);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        body.is-previewing {
            overflow: hidden;
        }

        .mono {
            font-family: var(--ds-font-mono);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* ---------- Header ---------- */

        .module-header {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            padding: 30px;
            background: var(--ds-bg-base);
            border-bottom: 1px solid var(--ds-border);
        }

        .module-title {
            font-size: 3rem;
            font-weight: 400;
            line-height: 0.95;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }

        .header-subtitle {
            margin-top: 10px;
            opacity: 0.6;
        }

        .header-controls {
            display: flex;
            align-items: stretch;
            border: 1px solid var(--ds-border);
        }

        .search-input {
            width: 260px;
            padding: 12px 14px;
            border: none;
            background: var(--ds-accent-white);
            font-family: var(--ds-font-mono);
            font-size: 0.8rem;
            text-transform: uppercase;
            outline: none;
        }

        .search-input:focus {
            background: var(--ds-accent-yellow);
        }

        /* ---------- Grid ---------- */

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr));
            gap: 1px;
            background-color: var(--ds-border);
            border-bottom: 1px solid var(--ds-border);
        }

        .page-card {
            display: flex;
            flex-direction: column;
            background-color: var(--ds-bg-base);
            color: inherit;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .page-card:hover,
        .page-card:focus-visible {
            background-color: var(--ds-accent-white);
            outline: none;
        }

        .card-label-band {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 16px;
            border-bottom: 1px solid var(--ds-border);
        }

        .card-label-band .file {
            opacity: 0.55;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .preview-frame {
            position: relative;
            aspect-ratio: 1440 / 900;
            overflow: hidden;
            background:
                repeating-linear-gradient(45deg, transparent 0 10px, rgba(0,0,0,0.05) 10px 11px),
                #d8d7d1;
            border-bottom: 1px solid var(--ds-border);
        }

        .preview-frame img {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top left;
        }

        .preview-frame iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: var(--preview-w);
            height: var(--preview-h);
            border: 0;
            background: white;
            transform-origin: 0 0;
            transform: scale(var(--scale, 0.25));
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .preview-frame.is-live iframe {
            opacity: 1;
        }

        .preview-status {
            position: absolute;
            z-index: 1;
            right: 10px;
            top: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px;
            background: var(--ds-bg-base);
            border: 1px solid var(--ds-border);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .preview-status::before {
            content: "";
            width: 6px;
            height: 6px;
            background: var(--ds-border);
        }

        .preview-frame.no-snapshot .preview-status,
        .preview-frame.is-loading .preview-status,
        .preview-frame.is-live .preview-status {
            opacity: 1;
        }

        .preview-frame.no-snapshot .preview-status {
            top: auto;
            right: auto;
            left: 12px;
            bottom: 10px;
        }

        .preview-frame.no-snapshot .preview-status::before {
            display: none;
        }

        .preview-frame.is-loading .preview-status::before {
            animation: blink 0.8s steps(2) infinite;
        }

        .preview-frame.is-live .preview-status {
            background: var(--ds-accent-green);
        }

        @keyframes blink { 50% { opacity: 0; } }

        .card-title-band {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            padding: 18px 16px 20px;
            flex-grow: 1;
        }

        .card-title-band h3 {
            font-size: 1.5rem;
            font-weight: 400;
            line-height: 1.05;
            text-transform: uppercase;
            overflow-wrap: anywhere;
        }

        .card-arrow {
            flex-shrink: 0;
            font-size: 1.4rem;
            transition: transform 0.2s;
        }

        .page-card:hover .card-arrow {
            transform: translateX(4px);
        }

        .empty-state {
            padding: 60px 30px;
            border-bottom: 1px solid var(--ds-border);
        }

        /* ---------- Full preview ---------- */

        .preview-container {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            background: var(--ds-bg-base);
        }

        .preview-header {
            display: flex;
            align-items: stretch;
            height: 56px;
            border-bottom: 1px solid var(--ds-border);
            flex-shrink: 0;
        }

        .preview-header > * {
            display: flex;
            align-items: center;
            padding: 0 18px;
            border-right: 1px solid var(--ds-border);
        }

        .preview-header button,
        .preview-header a {
            border-top: 0;
            border-bottom: 0;
            border-left: 0;
            background: transparent;
            color: inherit;
            text-decoration: none;
            cursor: pointer;
        }

        .preview-header button:hover,
        .preview-header a:hover {
            background: var(--ds-accent-yellow);
        }

        .preview-header .back-btn {
            background: var(--ds-border);
            color: var(--ds-bg-base);
        }

        .preview-header .back-btn:hover {
            background: var(--ds-border);
            opacity: 0.85;
        }

        .preview-header .current-title {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: block;
            line-height: 56px;
        }

        .preview-header > :last-child {
            border-right: 0;
        }

        .preview-iframe {
            flex: 1;
            width: 100%;
            border: none;
            background: white;
        }

        @media (max-width: 700px) {
            .module-header {
                padding: 20px 16px;
            }
            .module-title {
                font-size: 2rem;
            }
            .header-controls {
                width: 100%;
            }
            .search-input {
                flex: 1;
                width: auto;
                min-width: 0;
            }
            .preview-header > * {
                padding: 0 12px;
            }
            .preview-header .hide-sm {
                display: none;
            }
        }
    </style>
</head>
<body :class="{ 'is-previewing': activePage }" x-data="galleryApp()" @keydown.window="onKey($event)">
    <header class="module-header">
        <div>
            <h1 class="module-title">Design<br>Gallery</h1>
            <p class="header-subtitle mono" x-text="filtered.length === pages.length
                ? `${pages.length} pages`
                : `${filtered.length} / ${pages.length} pages`"></p>
        </div>
        <div class="header-controls">
            <input class="search-input" type="search" placeholder="Filter…" aria-label="Filter pages"
                   x-model.debounce.150ms="query" x-ref="search">
        </div>
    </header>

    <main class="gallery-grid">
        <template x-for="page in filtered" :key="page.filename">
            <a class="page-card" :href="pageUrl(page)" @click.prevent="openPreview(page)"
               @mouseenter="LivePreview.hover($el)" @mouseleave="LivePreview.stop($el)"
               @focus="LivePreview.focus($el)" @blur="LivePreview.stop($el)">
                <div class="card-label-band mono">
                    <span x-text="String(pages.indexOf(page) + 1).padStart(2, '0')"></span>
                    <span class="file" x-text="page.filename"></span>
                </div>
                <div class="preview-frame" :class="{ 'no-snapshot': !page.thumbnail }" x-live-preview="pageUrl(page)">
                    <template x-if="page.thumbnail">
                        <img :src="page.thumbnail" alt="" loading="lazy" decoding="async" width="960" height="600">
                    </template>
                    <span class="preview-status mono" x-text="page.thumbnail ? 'Live' : 'No snapshot yet'"></span>
                </div>
                <div class="card-title-band">
                    <h3 x-text="page.title"></h3>
                    <span class="card-arrow" aria-hidden="true">→</span>
                </div>
            </a>
        </template>
    </main>

    <p class="empty-state mono" x-cloak x-show="filtered.length === 0">No pages match “<span x-text="query"></span>”</p>

    <div class="preview-container" x-cloak x-show="activePage" role="dialog" aria-modal="true" :aria-label="activePage?.title">
        <nav class="preview-header mono">
            <button class="back-btn" type="button" @click="closePreview()">← Gallery</button>
            <span class="current-title" x-text="activePage?.title || ''"></span>
            <button type="button" @click="step(-1)" title="Previous (←)">←<span class="hide-sm">&nbsp;Prev</span></button>
            <button type="button" @click="step(1)" title="Next (→)"><span class="hide-sm">Next&nbsp;</span>→</button>
            <a class="hide-sm" :href="activePage ? pageUrl(activePage) : '#'" target="_blank" rel="noopener">Open ↗</a>
        </nav>
        <template x-if="activePage">
            <iframe class="preview-iframe" :src="pageUrl(activePage)" :title="activePage.title"></iframe>
        </template>
    </div>

    <script src="pages-data.js"></script>
    <script>
        /*
         * Cards show a static snapshot (see generate-thumbnails.js). Hovering or
         * focusing a card swaps in a live iframe of the page, scaled down to the
         * card. At most one live preview exists at a time, and it is destroyed as
         * soon as the pointer leaves, so idle cards cost nothing.
         */
        const LivePreview = (() => {
            const HOVER_INTENT_MS = 250;   // ignore the pointer just passing over a card
            const PREVIEW_WIDTH = 1440;    // matches --preview-w
            const canHover = matchMedia('(hover: hover) and (pointer: fine)');

            let current = null;            // { card, frame, iframe }
            let pendingCard = null;
            let timer = null;

            function destroy() {
                if (!current) return;
                const { frame, iframe } = current;
                // Blank it first so the page's timers/animation loops stop immediately.
                try { iframe.src = 'about:blank'; } catch (e) {}
                iframe.remove();
                frame.classList.remove('is-loading', 'is-live');
                current = null;
            }

            function mount(card) {
                const frame = card.querySelector('[data-live-src]');
                if (!frame) return;
                destroy();

                const iframe = document.createElement('iframe');
                iframe.tabIndex = -1;
                iframe.setAttribute('aria-hidden', 'true');
                iframe.setAttribute('scrolling', 'no');
                iframe.title = '';
                frame.style.setProperty('--scale', (frame.clientWidth / PREVIEW_WIDTH).toFixed(4));
                frame.classList.add('is-loading');
                iframe.addEventListener('load', () => {
                    if (current?.iframe !== iframe) return;
                    // Give the page a moment to paint before covering the snapshot.
                    requestAnimationFrame(() => requestAnimationFrame(() => {
                        if (current?.iframe !== iframe) return;
                        frame.classList.remove('is-loading');
                        frame.classList.add('is-live');
                    }));
                }, { once: true });
                iframe.src = frame.dataset.liveSrc;
                frame.append(iframe);
                current = { card, frame, iframe };
            }

            return {
                // Mouse hover on devices that have one; touch taps just open the page.
                hover(card) {
                    if (canHover.matches) this.start(card);
                },
                // Keyboard focus, but not the focus a tap/click gives the link.
                focus(card) {
                    if (card.matches(':focus-visible')) this.start(card);
                },
                start(card) {
                    if (current?.card === card) return;
                    clearTimeout(timer);
                    pendingCard = card;
                    timer = setTimeout(() => {
                        if (pendingCard === card) mount(card);
                    }, HOVER_INTENT_MS);
                },
                stop(card) {
                    if (pendingCard === card) {
                        clearTimeout(timer);
                        pendingCard = null;
                    }
                    // Still hovered or focused (e.g. focus left but pointer is over it)?
                    if (card.matches(':hover') || document.activeElement === card) return;
                    if (current?.card === card) destroy();
                },
                stopAll() {
                    clearTimeout(timer);
                    pendingCard = null;
                    destroy();
                },
            };
        })();

        document.addEventListener('alpine:init', () => {
            Alpine.directive('live-preview', (el, { expression }, { evaluate, cleanup }) => {
                el.dataset.liveSrc = evaluate(expression);
                cleanup(() => {
                    const card = el.closest('.page-card');
                    if (card) LivePreview.stop(card);
                });
            });
        });

        function galleryApp() {
            const pages = typeof pagesData !== 'undefined' ? pagesData : [];

            return {
                pages,
                query: '',
                activePage: null,

                init() {
                    this.$watch('activePage', page => page && LivePreview.stopAll());
                    this.syncFromHash();
                    window.addEventListener('hashchange', () => this.syncFromHash());
                },

                get filtered() {
                    const q = this.query.trim().toLowerCase();
                    if (!q) return this.pages;
                    return this.pages.filter(p =>
                        p.title.toLowerCase().includes(q) || p.filename.toLowerCase().includes(q));
                },

                pageUrl(page) {
                    return 'pages/' + encodeURIComponent(page.filename);
                },

                openPreview(page) {
                    location.hash = encodeURIComponent(page.filename);
                },

                closePreview() {
                    if (location.hash) history.pushState('', document.title, location.pathname + location.search);
                    this.activePage = null;
                },

                syncFromHash() {
                    const name = decodeURIComponent(location.hash.slice(1));
                    this.activePage = this.pages.find(p => p.filename === name) || null;
                },

                step(delta) {
                    const list = this.filtered.includes(this.activePage) ? this.filtered : this.pages;
                    const i = list.indexOf(this.activePage);
                    this.openPreview(list[(i + delta + list.length) % list.length]);
                },

                onKey(e) {
                    if (this.activePage) {
                        if (e.key === 'Escape') this.closePreview();
                        else if (e.key === 'ArrowLeft') this.step(-1);
                        else if (e.key === 'ArrowRight') this.step(1);
                    } else if (e.key === '/' && document.activeElement !== this.$refs.search) {
                        e.preventDefault();
                        this.$refs.search.focus();
                    }
                },
            };
        }
    </script>
</body>
</html>
